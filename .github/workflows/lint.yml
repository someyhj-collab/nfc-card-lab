name: lint
on: workflow_dispatch
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 工具回归
        run: |
          set -x
          python3 tools/gen_xcodeproj.py
          python3 tools/ntag_build.py --text "https://ci.test" --uri --chip 213 -o /tmp/o
          python3 tools/ntag_build.py --read /tmp/o/pages.txt --chip 213
          python3 tools/crypto1.py defaults | head -3
          python3 tools/crypto1.py check --mfd sample/example-card.json 2>&1 | head -3 || true
          python3 tools/pack_ipa.py --help > /dev/null
          python3 -c "import plistlib;plistlib.load(open('Resources/Info.plist','rb'));print('plist ok')"
          python3 -c "import plistlib;plistlib.load(open('Entitlements/NFCCardLab.entitlements','rb'));print('ent ok')"
      - name: 校验 pbxproj
        run: |
          python3 - <<'EOF'
          import re
          s=open('NFCCardLab.xcodeproj/project.pbxproj').read()
          ids=set(re.findall(r'\b([0-9A-F]{24})\b', s))
          defined=set(re.findall(r'^\t+([0-9A-F]{24}) ', s, re.M))
          missing=ids-defined
          assert not missing, f"missing ids: {missing}"
          print(f"pbxproj ok: {len(ids)} ids")
          EOF
      - name: Swift 文件配平
        run: |
          python3 - <<'EOF'
          import re, glob
          for p in sorted(glob.glob('Sources/*.swift')):
              s=open(p).read()
              t=re.sub(r'"(?:\\.|[^"\\])*"','""',s)
              t=re.sub(r'//[^\n]*','',t)
              t=re.sub(r'/\*[\s\S]*?\*/','',t)
              for a,b,n in [('{','}','brace'),('(',')','paren'),('[',']','bracket')]:
                  assert t.count(a)==t.count(b), f"{p}: {n} {t.count(a)}/{t.count(b)}"
              print(f"ok {p}")
          EOF
